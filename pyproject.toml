[project]
name = "udp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adafruit-circuitpython-bmp280>=3.3.12",
    "adafruit-circuitpython-dht>=4.0.12",
    "adafruit-circuitpython-tsl2591>=1.4.8",
    "adafruit-lgpio>=0.2.2.0",
]

[project.scripts]
udp = "udp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
